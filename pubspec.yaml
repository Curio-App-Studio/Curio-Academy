name: curio_math
description: "Curio Academy - Interactive Math & English learning companion for LKG to Class 8."
publish_to: 'none'

version: 1.0.0+4

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.5
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/curio_logo_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/curio_logo_1024.png"

flutter:
  uses-material-design: true

  assets:
    - assets/curriculum/
    - assets/images/
    - assets/audio/
